[project]
name = "personal-assistant"
version = "0.1.0"
description = "Personal assistant with a command-line interface: contacts and notes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "prompt_toolkit>=3",
]

[project.scripts]
assistant = "personal_assistant.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
