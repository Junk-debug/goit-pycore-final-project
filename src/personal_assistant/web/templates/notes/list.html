{% extends "base.html" %}
{% block title %}Notes{% endblock %}
{% block content %}
  <div class="row">
    <h1>Notes</h1>
    <a class="button primary" href="{{ url_for('new_note_form') }}">+ Write a note</a>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form
    class="filters"
    hx-get="{{ url_for('list_notes') }}"
    hx-target="#note-results"
    hx-swap="innerHTML"
    hx-trigger="input changed delay:400ms from:input, change from:select"
    hx-push-url="true"
  >
    <input type="text" name="query" value="{{ query }}" placeholder="Search text" style="min-width: 14rem;">
    <input type="text" name="tag" value="{{ tag }}" list="known-tags" placeholder="Filter by tag">
    <datalist id="known-tags">
      {% for name in all_tags %}<option value="{{ name }}">{% endfor %}
    </datalist>
    <select name="sort">
      <option value="">Sort…</option>
      {% for key in sort_keys %}
        <option value="{{ key }}" {{ "selected" if sort == key }}>{{ key|capitalize }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit">Apply</button></noscript>
  </form>

  <div id="note-results">
    {% include "notes/_results.html" %}
  </div>
{% endblock %}
