{% extends "base.html" %}
{% block title %}Contacts{% endblock %}
{% block content %}
  <div class="row">
    <h1>Contacts</h1>
    <a class="button primary" href="{{ url_for('new_contact_form') }}">+ Add contact</a>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form
    class="filters"
    hx-get="{{ url_for('list_contacts') }}"
    hx-target="#contact-results"
    hx-swap="innerHTML"
    hx-trigger="input changed delay:400ms from:input, change from:select"
    hx-push-url="true"
  >
    <input type="text" name="query" value="{{ query }}" placeholder="Search name, phone, email, address" style="min-width: 16rem;">
    <input type="number" name="birthday_in" value="{{ birthday_in }}" min="0" placeholder="Birthday within, days" style="width: 12rem">
    <select name="sort">
      <option value="">Sort…</option>
      {% for key in sort_keys %}
        <option value="{{ key }}" {{ "selected" if sort == key }}>{{ key|capitalize }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit">Apply</button></noscript>
  </form>

  <div id="contact-results">
    {% include "contacts/_results.html" %}
  </div>
{% endblock %}
