<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Personal Assistant{% endblock %}</title>
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f46e5%22/><text x=%2216%22 y=%2222%22 font-family=%22system-ui%22 font-size=%2218%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>A</text></svg>">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #4f46e5;
      --accent-ink: #ffffff;
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --accent-soft-strong: color-mix(in srgb, var(--accent) 22%, transparent);
      --danger: #dc2626;
      --danger-soft: color-mix(in srgb, var(--danger) 10%, transparent);
      --surface: color-mix(in srgb, CanvasText 4%, Canvas);
      --surface-raised: color-mix(in srgb, CanvasText 2%, Canvas);
      --border: color-mix(in srgb, CanvasText 12%, transparent);
      --border-strong: color-mix(in srgb, CanvasText 22%, transparent);
      --muted: color-mix(in srgb, CanvasText 52%, transparent);
      --shadow-sm: 0 1px 2px color-mix(in srgb, CanvasText 6%, transparent);
      --shadow-md: 0 8px 24px -8px color-mix(in srgb, CanvasText 18%, transparent);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 999px;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2.5rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
      font: 400 15px/1.55 -apple-system, "SF Pro Text", "Segoe UI", Roboto,
        Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 { font-weight: 650; letter-spacing: -0.02em; margin: 0; }

    a { color: var(--accent); }

    /* --- header --- */

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--space-5);
      padding: var(--space-3) var(--space-5);
      background: color-mix(in srgb, Canvas 82%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: inherit;
    }

    header .brand .mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 800;
    }

    header nav { display: flex; gap: var(--space-1); margin-left: auto; }

    header nav a {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      color: var(--muted);
      text-decoration: none;
      font-weight: 550;
      font-size: 0.9rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    header nav a:hover { color: CanvasText; background: var(--surface); }
    header nav a.active { color: var(--accent); background: var(--accent-soft); }

    /* --- layout --- */

    main { max-width: 920px; margin: 0 auto; padding: var(--space-6) var(--space-5) 5rem; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-5);
    }

    .row h1 { font-size: 1.6rem; }
    .muted { color: var(--muted); }
    .stack { display: flex; align-items: center; gap: var(--space-2); }

    /* --- cards --- */

    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .stat .figure { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }

    /* --- buttons --- */

    .button, button, input[type=submit] {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font: inherit;
      font-weight: 550;
      font-size: 0.88rem;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease,
        border-color 0.15s ease;
    }

    .button:hover, button:hover, input[type=submit]:hover {
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .button:active, button:active, input[type=submit]:active { transform: scale(0.98); }

    .button.primary, button.primary, input[type=submit] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      box-shadow: var(--shadow-sm);
    }

    .button.primary:hover, button.primary:hover, input[type=submit]:hover {
      filter: brightness(1.08);
      border-color: var(--accent);
    }

    button.danger {
      color: var(--danger);
      border-color: var(--danger-soft);
      background: transparent;
    }

    button.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

    /* --- tag pills --- */

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 550;
      padding: 0.15rem 0.65rem;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      margin: 0 var(--space-1) var(--space-1) 0;
      transition: background 0.15s ease;
    }

    a.tag:hover { background: var(--accent-soft-strong); }

    /* --- avatar --- */

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* --- table --- */

    .table-wrap {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td { text-align: left; padding: var(--space-3) var(--space-4); }

    th {
      font-size: 0.72rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s ease; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }

    td .name-cell { display: flex; align-items: center; gap: var(--space-3); }
    td .name-cell a { color: inherit; text-decoration: none; font-weight: 600; }
    td .name-cell a:hover { color: var(--accent); }

    /* --- note cards (grid) --- */

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--space-4);
    }

    .note-card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-height: 130px;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .note-card-link { text-decoration: none; color: inherit; flex-grow: 1; }
    .note-card .preview { font-size: 0.92rem; line-height: 1.5; }
    .note-card .tags { display: flex; flex-wrap: wrap; }
    .note-card .meta { font-size: 0.76rem; color: var(--muted); }
    .note-card .foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .note-card button.danger { font-size: 0.76rem; padding: 0.2rem 0.6rem; }

    /* --- forms --- */

    form.filters {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
    }

    form.filters input, form.filters select {
      font: inherit;
      font-size: 0.88rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: inherit;
    }

    form.edit { max-width: 32rem; }

    form.edit label {
      display: block;
      font-size: 0.82rem;
      font-weight: 550;
      color: var(--muted);
      margin: var(--space-4) 0 var(--space-2);
    }

    form.edit label:first-child { margin-top: 0; }

    form.edit input, form.edit textarea {
      width: 100%;
      font: inherit;
      font-size: 0.92rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    form.edit textarea { min-height: 7rem; resize: vertical; font-family: inherit; }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    form.edit .actions { margin-top: var(--space-5); display: flex; gap: var(--space-2); }
    form.inline { display: inline; }

    /* --- feedback --- */

    .error {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
      background: var(--danger-soft);
      color: var(--danger);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
      font-size: 0.9rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: var(--space-6) var(--space-4);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }

    .empty svg { opacity: 0.35; margin-bottom: var(--space-2); }

    dl.fields {
      display: grid;
      grid-template-columns: 8rem 1fr;
      gap: var(--space-3) var(--space-4);
      margin: 0;
    }

    dl.fields dt { color: var(--muted); font-size: 0.88rem; }
    dl.fields dd { margin: 0; }

    .hero {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .hero .avatar { width: 52px; height: 52px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">
      <span class="mark">A</span>
      Personal Assistant
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Home</a>
      <a href="{{ url_for('list_contacts') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('list_contacts') or (request.endpoint and 'contact' in request.endpoint) }}">Contacts</a>
      <a href="{{ url_for('list_notes') }}" class="{{ 'active' if request.endpoint and 'note' in request.endpoint }}">Notes</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
